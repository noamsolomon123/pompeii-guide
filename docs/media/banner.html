<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:800px;overflow:hidden;font-family:Heebo,sans-serif;color:#fff;position:relative;background:#1a1210}
.bg{position:absolute;inset:0;background:url(forum-vesuvius.jpg) center 60%/cover;filter:saturate(1.15) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(40,14,10,.92) 0%,rgba(90,24,18,.75) 38%,rgba(30,10,8,.15) 70%,rgba(0,0,0,.35) 100%),linear-gradient(0deg,rgba(0,0,0,.45),transparent 40%)}
.txt{position:absolute;right:90px;top:150px;width:780px}
.kicker{font-size:24px;letter-spacing:.5px;color:#f0c97a;font-weight:600;margin-bottom:18px}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:118px;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.sub{font-size:34px;margin-top:22px;line-height:1.35;color:#fbeee0}
.pills{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.pill{border:1.5px solid rgba(240,201,122,.7);background:rgba(0,0,0,.25);border-radius:40px;padding:10px 22px;font-size:22px;font-weight:600}
.phone{position:absolute;left:150px;top:60px;width:330px;height:714px;border-radius:52px;background:#111;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #444 inset;transform:rotate(-4deg)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:42px;display:block}
.notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:#111;border-radius:50%}
.foot{position:absolute;right:90px;bottom:44px;font-size:20px;color:rgba(255,255,255,.75)}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="phone"><img src="app-screen.png"><div class="notch"></div></div>
<div class="txt">
  <div class="kicker">🏛️ קוד פתוח · חינם</div>
  <h1>מדריך פומפיי</h1>
  <div class="sub">מדריך טיולים AI שמדבר עברית.<br>מכוונים את הטלפון, והוא מספר.</div>
  <div class="pills"><span class="pill">🎧 מספר בעברית</span><span class="pill">📍 זיהוי GPS + מצלמה</span><span class="pill">🎙️ שואלים בקול</span><span class="pill">📴 עובד אופליין</span></div>
</div>
<div class="foot">24 תחנות · Android · נבנה בווייב-קודינג עם Claude Code + Gemini</div>
</body></html>
